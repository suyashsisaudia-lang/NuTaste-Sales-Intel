services:
  salesdesk:
    build: .
    ports:
      - "8000:8000"
    environment:
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SECRET_KEY: ${SECRET_KEY}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DATA_DIR: /data
    volumes:
      - salesdesk-data:/data
    restart: unless-stopped

volumes:
  salesdesk-data:
