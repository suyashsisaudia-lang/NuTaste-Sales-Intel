<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  .gate{min-height:100vh;display:grid;place-items:center;background:var(--brand);padding:24px}
  .gate-card{width:100%;max-width:380px;background:var(--surface);border-radius:14px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .gate-brand{font-weight:700;font-size:20px;color:var(--brand);letter-spacing:-.01em}
  .gate-brand span{font-weight:500;color:var(--ink-3);font-size:12px;letter-spacing:.08em;margin-left:8px}
  .gate h1{font-size:16px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
  .gate p{color:var(--ink-2);font-size:13px;margin:0 0 18px;line-height:1.5}
  .gate input[type=password]{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--hairline);border-radius:9px;background:var(--surface-2);color:var(--ink)}
  .gate input[type=password]:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .gate button{margin-top:12px;width:100%;font:inherit;font-weight:600;font-size:14px;padding:11px;border:0;border-radius:9px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
  .gate button:hover{filter:brightness(1.08)}
  .gate .err{background:#fdecec;color:#9b2226;border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:12px}
  .gate .err:empty{display:none}
  .gate .hint{margin-top:16px;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<main class="gate">
  <form class="gate-card" method="post" action="{{ action }}" autocomplete="off">
    <div class="gate-brand">NuTaste<span>SALES DESK</span></div>
    <h1>{{ heading }}</h1>
    <p>Enter the access password to continue.</p>
    <div class="err">{{ error }}</div>
    <input type="password" name="password" placeholder="Password" required autofocus autocomplete="current-password">
    <button type="submit">Continue</button>
    <div class="hint">{{ hint }}</div>
  </form>
</main>
</body>
</html>
